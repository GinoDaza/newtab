<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #1b2a33 url(bg.jpg) center / cover no-repeat fixed;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 140px;
    box-sizing: border-box;
  }
  form { width: min(760px, 90vw); }
  input[type=search] {
    width: 100%;
    box-sizing: border-box;
    height: 56px;
    border: 0;
    border-radius: 28px;
    padding: 0 26px;
    font-size: 17px;
    outline: none;
  }
  .grid {
    width: min(620px, 90vw);
    margin-top: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 10px 8px;
  }
  .grid a {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    padding: 8px 4px;
    border-radius: 8px;
    color: #fff;
    text-decoration: none;
    font-size: 12px;
    text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
  }
  .grid a:hover, .grid a:focus { background: rgba(0, 0, 0, .35); outline: none; }
  .grid .ico {
    width: 38px;
    height: 38px;
    border-radius: 9px;
    background: rgba(40, 40, 40, .85);
    display: grid;
    place-items: center;
  }
  .grid img { width: 22px; height: 22px; }
  .grid span.name { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<form id="search" action="https://www.google.com/search" method="get">
  <input id="q" type="search" name="q" placeholder="Search Google or type a URL" autocomplete="off" autofocus>
</form>
<nav class="grid" id="grid"></nav>
<script>
  // [label, url] — add or reorder here
  const shortcuts = [
    ["Gmail", "https://mail.google.com"],
    ["Drive", "https://drive.google.com"],
    ["Translate", "https://translate.google.com"],
    ["Calendar", "https://calendar.google.com"],
    ["Github", "https://github.com"],
    ["Gradescope", "https://www.gradescope.com"],
    ["Piazza", "https://piazza.com"],
    ["Sistema Académico", "https://sistema-academico.utec.edu.pe"],
    ["Gemini", "https://gemini.google.com"],
  ];
  // Domains and URLs open directly; anything else goes to Google
  const q = document.getElementById("q");
  const looksLikeUrl = t => /^(https?|file|chrome|edge|about):/i.test(t) ||
    /^(localhost|(\d{1,3}\.){3}\d{1,3})(:\d+)?(\/\S*)?$/i.test(t) ||
    /^[^\s\/]+\.[a-z]{2,}(:\d+)?([\/?#]\S*)?$/i.test(t);
  document.getElementById("search").addEventListener("submit", e => {
    const t = q.value.trim();
    if (!looksLikeUrl(t)) return;
    e.preventDefault();
    location.href = /^[a-z][a-z0-9+.-]*:/i.test(t) ? t : "https://" + t;
  });
  // Ctrl+T can leave focus in the address bar, so take it back once the page loads
  q.focus();
  window.addEventListener("load", () => q.focus());

  const grid = document.getElementById("grid");
  for (const [name, url] of shortcuts) {
    const a = document.createElement("a");
    a.href = url;
    a.innerHTML = '<div class="ico"><img alt=""></div><span class="name"></span>';
    a.querySelector("img").src = "https://www.google.com/s2/favicons?sz=64&domain=" + new URL(url).hostname;
    a.querySelector(".name").textContent = name;
    grid.append(a);
  }
</script>
</body>
</html>
